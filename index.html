<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>检验检测机构资质认定能力项目库查询系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .tips {background:#e9f7ff;padding:15px;border-radius:8px;margin-bottom:20px;}
        .in{color:#198754;font-weight:bold;}
        .out{color:#dc3545;font-weight:bold;}
    </style>
</head>
<body>
<div class="container mt-4 mb-5">
    <h2 class="text-center text-primary mb-4">检验检测机构资质认定能力项目库查询系统</h2>

    <div class="tips">
        <h5>📌 使用说明</h5>
        <p>1. 系统自动加载云端标准库，无需手动导入</p>
        <p>2. 支持输入标准编号、标准名称模糊查询</p>
        <p>3. 标准编号自动忽略空格，无需严格对齐</p>
        <p>4. 批量查询请下载模板，上传Excel即可</p>
        <p>5. 库更新只需后台更新library.xlsx，网站自动生效</p>
    </div>

    <div class="alert alert-info" id="loadTip">⏳ 正在自动加载标准库，请稍候...</div>

    <!-- 单条查询 -->
    <div class="card p-3 mb-4">
        <label class="form-label">输入标准编号 / 标准名称</label>
        <div class="d-flex gap-2">
            <input type="text" id="kw" class="form-control" placeholder="例如：GB5749-2022 或 生活饮用水卫生标准">
            <button onclick="searchOne()" class="btn btn-primary">查询</button>
        </div>
        <div id="oneRes" class="mt-3"></div>
    </div>

    <!-- 批量查询 -->
    <div class="card p-3 mb-4">
        <div class="mb-2">
            <button onclick="downTemplate()" class="btn btn-success">下载批量查询模板</button>
        </div>
        <input type="file" id="batchFile" accept=".xlsx,.xls" class="form-control mb-2">
        <button onclick="searchBatch()" class="btn btn-primary">开始批量查询</button>
    </div>

    <!-- 批量结果 -->
    <div id="batchRes"></div>
</div>

<script>
let db = [];

// 自动加载云端Excel标准库
async function loadLib() {
    try {
        let res = await fetch("./library.xlsx");
        let blob = await res.blob();
        let data = await blob.arrayBuffer();
        let wb = XLSX.read(data, {type:"array"});
        let sheet = wb.Sheets[wb.SheetNames[0]];
        let list = XLSX.utils.sheet_to_json(sheet);

        db = [];
        list.forEach(row => {
            let code = (row["标准编号(含年号)"] || "").toString().replace(/\s/g,"");
            let name = (row["标准(方法)名称"] || "").trim();
            let field = (row["领域"] || "").trim();
            let remark = (row["备注"] || "").trim();
            if(code && name) {
                db.push({code,name,field,remark});
            }
        });
        document.getElementById("loadTip").className = "alert alert-success";
        document.getElementById("loadTip").innerText = `✅ 标准库加载完成，共 ${db.length} 条标准`;
    } catch(e) {
        document.getElementById("loadTip").className = "alert alert-danger";
        document.getElementById("loadTip").innerText = "❌ 加载标准库失败，请检查library.xlsx文件是否存在";
    }
}

// 单条查询
function searchOne() {
    let kw = document.getElementById("kw").value.trim().replace(/\s/g,"");
    let box = document.getElementById("oneRes");
    if(!kw) {box.innerHTML = "<span class='text-warning'>请输入查询内容</span>";return;}

    let find = db.find(x=>x.code.includes(kw) || x.name.includes(kw));
    if(find) {
        box.innerHTML = `
        <div class="p-3 bg-light rounded">
            <p class="in">✅ 在资质认定库中</p>
            <p>领域：${find.field}</p>
            <p>标准编号：${find.code}</p>
            <p>标准名称：${find.name}</p>
            <p>备注：${find.remark||"无"}</p>
        </div>
        `;
    } else {
        box.innerHTML = `<span class="out">❌ 不在资质认定库中</span>`;
    }
}

// 下载批量查询模板
function downTemplate() {
    let arr = [["标准编号","标准名称"],["GB5749-2022","生活饮用水卫生标准"]];
    let ws = XLSX.utils.aoa_to_sheet(arr);
    let wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"模板");
    XLSX.writeFile(wb,"标准批量查询模板.xlsx");
}

// 批量查询
function searchBatch() {
    let file = document.getElementById("batchFile").files[0];
    if(!file) {alert("请选择Excel文件");return;}
    let reader = new FileReader();
    reader.onload = function(e){
        let data = new Uint8Array(e.target.result);
        let wb = XLSX.read(data,{type:"array"});
        let json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
        let html = `<table class="table table-bordered mt-3"><thead><tr><th>标准编号</th><th>标准名称</th><th>状态</th><th>所属领域</th></tr></thead><tbody>`;
        json.forEach(item=>{
            let qc = (item["标准编号"]||"").replace(/\s/g,"");
            let qn = (item["标准名称"]||"");
            let f = db.find(x=>x.code===qc || x.name.includes(qn));
            html += `<tr>
                <td>${qc}</td>
                <td>${qn}</td>
                <td class="${f?'in':'out'}">${f?'在库':'不在库'}</td>
                <td>${f?f.field:'-'}</td>
            </tr>`;
        });
        html += `</tbody></table>`;
        document.getElementById("batchRes").innerHTML = html;
    };
    reader.readAsArrayBuffer(file);
}

// 页面初始化自动加载库
window.onload = loadLib;
</script>
</body>
</html>
